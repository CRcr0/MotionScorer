name: Generate experiment-picture figures

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "experiment_picture.tex"
      - "build_experiment_picture_figures.py"
      - "plotting_picture/**"
      - "README_experiment_picture.md"
      - "requirements.txt"
      - ".github/workflows/generate-experiment-picture.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install plotting dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate vector PDFs, 600-dpi PNGs, and ZIP
        run: python build_experiment_picture_figures.py

      - name: Install LaTeX for smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra

      - name: Compile experiment_picture.tex
        run: |
          cat > experiment_picture_preview.tex <<'EOF'
          \documentclass[10pt,twocolumn]{article}
          \usepackage[T1]{fontenc}
          \usepackage[utf8]{inputenc}
          \usepackage[margin=0.65in]{geometry}
          \usepackage{graphicx}
          \usepackage{amsmath}
          \providecommand{\methodname}{nuGuidance}
          \begin{document}
          \input{experiment_picture.tex}
          \end{document}
          EOF
          pdflatex -interaction=nonstopmode -halt-on-error experiment_picture_preview.tex
          pdflatex -interaction=nonstopmode -halt-on-error experiment_picture_preview.tex

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figure/experiment_picture/*.pdf
          git add figure/experiment_picture/*.png
          git add MotionScorer_Experiment_Picture.zip
          git add experiment_picture_preview.pdf
          if git diff --cached --quiet; then
            echo "Generated artifacts are already up to date."
          else
            git commit -m "Generate experiment-picture figures and preview [skip ci]"
            git push
          fi

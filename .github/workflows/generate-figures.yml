name: Generate experiment figures and package

on:
  push:
    branches: [main]
    paths:
      - "build_all_figures.py"
      - "plot_experiment_figures.py"
      - "plotting/**"
      - "experiment.tex"
      - "appendix_numeric_tables.tex"
      - "smoke_test.tex"
      - "requirements.txt"
      - "README.md"
      - ".github/workflows/generate-figures.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install plotting dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate vector figures, 600-dpi previews, and ZIP
        run: python build_all_figures.py

      - name: Compile the drop-in experiment smoke test
        uses: xu-cheng/latex-action@v4
        with:
          root_file: smoke_test.tex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A figures MotionScorer_Experiment_Visuals.zip
          if git diff --cached --quiet; then
            echo "Generated artifacts are already up to date."
          else
            git commit -m "Regenerate redesigned experiment figures [skip ci]"
            git push
          fi
